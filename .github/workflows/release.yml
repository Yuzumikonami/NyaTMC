# ============================================================
#  nyatmc 发布流水线
#
#  触发：
#    · 推送 v* 标签（例如 v0.1.0）
#    · 手动触发（Actions → Run workflow，可填一个版本号）
#
#  流程：
#    test    → go vet ./... && go test ./...
#    build   → make build-all（linux/amd64、linux/arm64、windows/amd64）+ sha256sums.txt
#    release → 把三个二进制与校验文件传到 GitHub Release
# ============================================================
name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的版本号（例如 v0.1.0）；留空表示只构建产物、不发 Release'
        required: false
        default: ''
        type: string

permissions:
  contents: write

env:
  GOFLAGS: -trimpath

jobs:
  test:
    name: 测试（vet + test）
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Go（版本读 go.mod）
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

  build:
    name: 构建三平台二进制
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: 检出代码（git describe 需要标签与完整历史）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装 Go（版本读 go.mod）
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: 计算版本信息
        id: version
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_TAG}" ]; then
            version="${INPUT_TAG}"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME}"
          else
            version="$(git describe --tags --always --dirty)"
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "commit=$(git rev-parse --short HEAD)" >> "${GITHUB_OUTPUT}"
          echo "本次构建版本：${version}"

      - name: 交叉编译三个平台
        run: |
          set -euo pipefail
          go version
          make build-all \
            VERSION="${{ steps.version.outputs.version }}" \
            COMMIT="${{ steps.version.outputs.commit }}"

      - name: 生成 sha256 校验和
        run: |
          set -euo pipefail
          cd build
          sha256sum nyatmc-linux-amd64 nyatmc-linux-arm64 nyatmc-windows-amd64.exe > sha256sums.txt
          cat sha256sums.txt

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: nyatmc-binaries
          if-no-files-found: error
          path: |
            build/nyatmc-linux-amd64
            build/nyatmc-linux-arm64
            build/nyatmc-windows-amd64.exe
            build/sha256sums.txt

  release:
    name: 发布到 GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.tag != ''
    steps:
      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          name: nyatmc-binaries
          path: dist

      - name: 确定发布标签
        id: tag
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_TAG}" ]; then
            echo "tag=${INPUT_TAG}" >> "${GITHUB_OUTPUT}"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "${GITHUB_OUTPUT}"
          fi

      - name: 创建 / 更新 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: nyatmc ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          files: |
            dist/nyatmc-linux-amd64
            dist/nyatmc-linux-arm64
            dist/nyatmc-windows-amd64.exe
            dist/sha256sums.txt
