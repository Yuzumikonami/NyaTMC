# ============================================================
#  nyatmc 配置文件
#  路径：~/.nyatmc/config.toml（可用 --home / NYATMC_HOME 覆盖）
#  改完保存即生效：运行中的 supervisor 与 Web 都会热重载。
#  命令行也可以改：nyatmc config set server.memory 4G
# ============================================================

[general]
# 未显式指定实例时使用的实例名
default_instance = "default"
language = "zh-CN"
color = true
# supervisor 启动时是否顺带拉起服务端进程
auto_start = false

[server]
# paper / fabric / vanilla / spigot / purpur / custom
type = "paper"
# "latest" 表示自动取最新正式版
minecraft_version = "latest"
build = ""
loader_version = ""
installer_version = ""
java_path = "java"
memory = "2G"
min_memory = "512M"
port = 25565
max_players = 20
motd = "A NyaTMC powered Minecraft Server"
view_distance = 10
online_mode = true
jar_name = "server.jar"
world_name = "world"
# 是否同意 Minecraft EULA（https://aka.ms/MinecraftEULA），设为 true 才会写入 eula.txt
eula = false
# 启动前自动补齐 / 更新服务端文件
auto_download = true
jvm_args = [
  "-XX:+UseG1GC",
  "-XX:+ParallelRefProcEnabled",
  "-XX:MaxGCPauseMillis=200",
  "-XX:+UnlockExperimentalVMOptions",
  "-XX:+DisableExplicitGC",
  "-XX:+AlwaysPreTouch",
  "-XX:G1NewSizePercent=30",
  "-XX:G1MaxNewSizePercent=40",
  "-XX:G1HeapRegionSize=8M",
  "-XX:G1ReservePercent=20",
  "-XX:G1HeapWastePercent=5",
  "-XX:G1MixedGCCountTarget=4",
  "-XX:InitiatingHeapOccupancyPercent=15",
  "-XX:G1MixedGCLiveThresholdPercent=90",
  "-XX:G1RSetUpdatingPauseTimePercent=5",
  "-XX:SurvivorRatio=32",
  "-XX:+PerfDisableSharedMem",
  "-XX:MaxTenuringThreshold=1",
  "-Dfile.encoding=UTF-8",
]
server_args = ["--nogui"]

# 写入 server.properties 的额外键值（覆盖上面的同名设置）
[server.properties]
# enable-rcon = "true"
# rcon.port = "25575"

[daemon]
# 崩溃自动重启（看门狗）
watchdog = true
# RestartWindow 内最多重启次数，0 表示不限
max_restarts = 5
restart_window = "10m"
restart_delay = "5s"
# 优雅关闭时发往服务端控制台的命令
stop_command = "stop"
stop_timeout = "60s"
startup_timeout = "5m"
kill_timeout = "15s"
# 是否把服务端输出同时写进 nyatmc 控制台日志
capture_console = true
backup_before_start = false

[backup]
# 留空表示 <实例目录>/backups
dir = ""
keep = 10
max_age = "0s"
format = "tar.gz"
before_restore = true
# 备份前先 save-all / save-off，保证世界落盘一致
stop_before_backup = false
include = [
  "world",
  "world_nether",
  "world_the_end",
  "server.properties",
  "eula.txt",
  "ops.json",
  "whitelist.json",
  "banned-ips.json",
  "banned-players.json",
  "config",
  "mods",
  "plugins",
  "bukkit.yml",
  "spigot.yml",
  "commands.yml",
  "permissions.yml",
  "paper.yml",
  "paper-global.yml",
  "paper-world-defaults.yml",
]
exclude = ["logs", "cache", "backups", "libraries", "versions", ".nyatmc", "*.tmp", "*.log", "session.lock"]

[log]
# 超过该大小即归档，并在无人在线时通过优雅重启完成切割
rotate_size = "20MB"
keep_files = 5
max_age_days = 7
compress = true
# 日志超限时是否允许用优雅重启来切割（JVM 持有 latest.log 句柄，无法在线截断）。
# nyatmc 只在“当前没有玩家在线”且距上次切割超过 min_rotate_interval 时才动手，
# 有人在线时会推迟并在控制台提醒，因此不会打断玩家。
rotate_restart = true
min_rotate_interval = "1h"
# 托管服务端 log4j2.xml（写入前会备份原文件，默认关闭）
manage_log4j2 = false
# 控制台环形缓冲行数
console_lines = 500

[scheduler]
enabled = true
timezone = ""
# 内置调度器任务示例（用 nyatmc schedule add 命令添加更省事）
#   nyatmc schedule add daily-backup "0 4 * * *" backup
# [[scheduler.jobs]]
# name = "daily-backup"
# schedule = "0 4 * * *"
# action = "backup"
# instance = "default"
# label = "auto"

[web]
listen = "127.0.0.1:8080"
# 留空且只监听回环地址时免鉴权；对公网暴露请务必设置令牌
token = ""
enable_write = true
refresh_seconds = 3
open = false
max_log_lines = 2000

[tunnel]
provider = "cloudflared"
bin = ""
protocol = "quic"
token = ""
hostname = ""
auto_install = true
auto_start_with_web = false
extra_args = []

[downloader]
# 可选镜像基地址，例如自建 OpenBMCLAPI。
# 注意：公共 BMCLAPI（bmclapi2.bangbang93.com）已不可靠（会跳转到广告域名），
# 留空表示使用官方源；只有你确认可信的镜像才填。
mirror = ""
timeout = "10m"
verify_checksum = true
retries = 3
cache_dir = ""

[mods]
# modrinth（免注册）/ curseforge（需要 API Key）
provider = "modrinth"
curseforge_api_key = ""
mods_dir = "mods"
plugins_dir = "plugins"
game_version = ""
loader = ""
limit = 20

